spring:
  application:
    name: climalert
  docker:
    compose:
      enabled: false
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}

weatherapi:
  url-base: ${WEATHER_API_URL_BASE:https://api.weatherapi.com/v1}
  api-key: ${WEATHER_API_KEY:key_dummy}
  ubicacion: ${WEATHER_API_UBICACION:Llavallol}

climalert:
  destinatarios: admin@clima.com,emergencies@clima.com,meteorologia@clima.com
